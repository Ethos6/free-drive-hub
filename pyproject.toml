[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drivehub"
version = "0.1.0"
description = "Self-hosted hub that joins any number of Google Drive accounts into one drive: web app, WebDAV and pooled storage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
drivehub = "drivehub.cli:main"

[tool.setuptools.packages.find]
include = ["drivehub*"]

[tool.setuptools.package-data]
drivehub = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
